name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly upgrade and any publish run on triggers this workflow never sees, so they call this
  # gate as their own `verify` job rather than restating its steps and drifting from it.
  workflow_call:

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rustup is preinstalled on the runner and honours rust-toolchain.toml, so
      # the pinned channel and its components install on the first cargo call. One less third-party
      # action in the supply chain of a repo whose point is auditing its supply chain.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      # Every feature this crate offers to turn off has to still compile with it off. A feature is only
      # an escape hatch if the build someone gets by taking it is clean — and `cargo test` would not say
      # so, because it does not deny warnings, so the check has to be clippy's.
      - name: the optional features are optional
        run: |
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo test --workspace --no-default-features

      # The declared MSRV is a promise to consumers pinned below the channel this repo builds with, and
      # nothing else in this job would notice it breaking — every other step runs the newer toolchain.
      - name: the declared MSRV still compiles
        run: |
          set -euo pipefail
          msrv=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check --workspace --all-features --all-targets --locked

      # The published record has to match what the components declare. Rendered from the registry and
      # diff-checked here, so it cannot claim a lineage the code no longer has.
      - name: PROVENANCE.md is current
        run: |
          cargo test --workspace render_the_provenance_record
          git --no-pager diff --exit-code --no-color PROVENANCE.md

  # Separate job: the dependency set is a different question from whether the code compiles, and a
  # supply-chain failure should be readable as one rather than buried in a build log.
  supply-chain:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # Pinned, not `@latest`. cargo-vet's only release with prebuilt binaries is v0.10.0 (2024-10-03)
      # — 0.10.1 and 0.10.2 shipped to crates.io without release assets — so an unpinned install-action
      # silently gives 0.10.0, whose parser cannot read the trusted-publisher entries that 0.10.2
      # writes into imports.lock. A tool whose output another copy of itself has to parse must be the
      # same version on both sides, so the version lives here and moves deliberately.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2,cargo-deny@0.20.2

      # Every dependency delta we take has to have been reviewed by someone we trust — us, or one of
      # the audit sets we import. An uncertified delta fails here, which is the whole point.
      - run: cargo vet --locked

      # Licences against the allowlist, RUSTSEC advisories, banned crates, and sources other than
      # crates.io. The licence check is what keeps a viral dependency out mechanically.
      - run: cargo deny --all-features check
