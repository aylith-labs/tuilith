# Aylith catalog notifier. Pings aylith.com to rebuild its catalog whenever this
# repo pushes to its default branch, so the studio index stays current.
#
# Canonical copy lives in aylith-labs/aylith-com (.aylith/templates/). Rolled out
# to product repos by aylith-com/scripts/rollout-notifier.sh — edit there, not here.
#
# Uses the org-level Actions secret CATALOG_DISPATCH_TOKEN (a PAT/App token permitted to dispatch to
# aylith-labs/aylith-com).
#
# The dispatch is guarded because an org secret does not reach a PRIVATE repo on a free org plan —
# it resolves to an empty string, and the action fails with "Parameter token or opts.auth is
# required". That is not a missing secret and no amount of re-adding it helps: public repos in this
# org get the value and private ones do not. A private repo therefore skips, and says so, instead of
# failing a push for a notification nobody was waiting on.
name: Notify Aylith catalog

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      CATALOG_DISPATCH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
    steps:
      - if: env.CATALOG_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
          repository: aylith-labs/aylith-com
          event-type: catalog-refresh
      # Silence would read as "the catalog was told". Say which it was.
      - if: env.CATALOG_DISPATCH_TOKEN == ''
        run: |
          echo "::notice::Catalog not notified — CATALOG_DISPATCH_TOKEN is empty here." \
            "Org secrets do not reach private repos on a free org plan, so this repo cannot" \
            "dispatch until it is public or the token is added as a repo-level secret." \
            "aylith.com still picks the manifest up on its next scheduled build."
