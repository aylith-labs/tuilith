[workspace]
members = ["."]
resolver = "3"

[package]
name = "tuilith"
version = "0.1.0"
edition = "2024"
# The tested floor, not the theoretical one. `rust-toolchain.toml` pins a newer channel to build with,
# but nothing here needs it: `cargo +1.96.1 check --all-features --all-targets` passes. A consumer
# pinned to 1.96 — shefrd is — is refused by the declaration alone, never by the code, so the number
# has to be a measurement. CI holds it to that; raise it only when something actually needs to.
rust-version = "1.96"
description = "Reusable ratatui components with declared provenance and CI dependency checks"
repository = "https://github.com/aylith-labs/tuilith"
license = "MIT OR Apache-2.0"
keywords = ["ratatui", "tui", "terminal", "widgets", "supply-chain"]
categories = ["command-line-interface"]
# The provenance record is part of the package: a component's lineage is no use to a consumer who
# cannot read it from the crate they installed.
include = ["src/**", "vendor/**", "README.md", "PROVENANCE.md", "LICENSE-*", "CHANGELOG.md"]

[features]
default = ["background", "document-tree", "follow", "input", "os-appearance", "preview"]

# A component that needs a dependency of its own is a feature, so taking one component does not compile
# the others' dependency trees. `theme`, `overlay`, `inspect` and `provenance` need only ratatui and the
# registry, so they are always present and have no feature of their own.

# Terminal background detection. Pulls `terminal-colorsaurus` for the OSC query.
background = ["dep:terminal-colorsaurus"]
# A JSON document as a foldable tree. Pulls `serde_json`, and with it `preserve_order` — which is a
# feature a consumer inherits through unification, so it is not something to enable for everybody.
document-tree = ["dep:serde_json"]
# Reading the desktop's light/dark setting means running `reg.exe` under WSL and `defaults` on macOS.
# Those are the signals that answer where the terminal itself does not, so they are on by default — but
# a library spawning processes is a fair thing to refuse, and refusing costs only those two signals:
# the OSC query and `COLORFGBG` still work, and `Source` says when nothing answered.
os-appearance = ["background"]
# Terminal input that keeps the terminal's replies — mode-2031 colour-scheme reports, OSC 11 colours —
# as events instead of typing them into the application as keys. crossterm's parser, vendored with that
# fixed; `rustix` polls the terminal and `signal-hook` turns SIGWINCH into a resize, as in crossterm.
input = ["dep:futures-core", "dep:rustix", "dep:signal-hook"]
# Keeping a running application's light/dark mode current. Reads `input`'s replies, and falls back to
# `background`'s desktop probes when the terminal answers nothing.
follow = ["background", "input"]
# Image previews: which graphics protocol the terminal shows, encoding off the UI thread, a cache bounded
# by encoded bytes, and the widget that draws one. `ratatui-image` comes without its default chafa
# backend, a C library found through pkg-config, and `image` with PNG alone: a consumer enables the
# codecs it reads on its own `image` dependency and unification brings them here. The probe reads the
# terminal's answers through `input`.
preview = ["input", "dep:ratatui-image", "dep:image"]

# The example drives the component it is named after, so it only exists when that component does.
# Without this it is compiled under every feature selection and fails the no-default-features gate.
[[example]]
name = "background"
required-features = ["background"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A widget's draw call legitimately takes the frame, the area, the state and the palette.
too_many_arguments = "allow"
# Terminal geometry is `u16` throughout ratatui, and casting to `usize` to index is the ordinary
# operation rather than a smell.
cast_possible_truncation = "allow"
cast_lossless = "allow"

[dependencies]
# A requirement is a promise about what a consumer can already be holding, and
# `scripts/pin-declared-floors.py` builds against exactly the version each one names as its lowest.
# So widen only as far as something has actually been built: serde_json and terminal-colorsaurus keep
# their patch — widening those to the bare minor declared 1.0.0, which is a decade below anything that
# compiles here — and ratatui names 0.30.1 because ratatui-image requires it, so 0.30.0 cannot resolve.
ratatui = "0.30.1"
crossterm = "0.29.0"
# The distributed registry behind the provenance catalog: a component declares its own lineage next to
# itself, and nothing keeps a second list that could disagree.
inventory = "0.3.24"
serde_json = { version = "1.0.151", features = ["preserve_order"], optional = true }
terminal-colorsaurus = { version = "1.0.3", optional = true }
futures-core = { version = "0.3.33", optional = true }
# The floor is what ratatui-image itself requires of `image`.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25.6", default-features = false, features = ["png"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event"], optional = true }
signal-hook = { version = "0.3.18", default-features = false, optional = true }

[dev-dependencies]
insta = "1.48.0"

# A real pty for the input reader's test: a terminal in raw mode is the only honest place to feed it.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "pty", "termios"] }
